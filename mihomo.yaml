# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 机场订阅
proxy-providers:
  Airport1:
    url: "你的订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    proxy: 🎯 直连

# 节点信息
proxies:
  - {name: 🎯 直连, type: direct,udp: true}

# 全局配置 
mode: rule
mixed-port: 7890
bind-address: "*"
ipv6: false
allow-lan: true
log-level: warning
unified-delay: true
tcp-concurrent: true
global-ua: clash.meta
# 匹配进程 always/strict/off
#  - always, 开启，强制匹配所有进程
#  - strict, 默认，由 mihomo 判断是否开启
#  - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: off
# 推荐在给移动设备代理时启用，可以解决待机异常耗电的问题
disable-keep-alive: false
profile: {store-selected: true}

# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "ui"
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 流量嗅探
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    QUIC: {ports: [443]}
    TLS:  {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
  force-domain:
    - +.v2ex.com
  skip-domain:
    - '+.local'
    - '+.lan'
    - '+.localdomain'
    - '+.home.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.push.apple.com'
    - '+.apple.com'
    - '+.icloud.com'
    - '+.qq.com'
    - '+.weixin.qq.com'
    - '+.alicdn.com'
    - '+.bdstatic.com'
    - '+.bilibili.com'
    - '+.taobao.com'
    - '+.jd.com'
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.miwifi.com'
    - '+.xiaomi.com'
    - '+.mihome.com'
    - '+.yeelight.com'
    - '+.yeelink.net'
    - '*.wechat.com'
    - '*.wechatapp.com'
  skip-src-address:
    - 192.168.1.1/24
    - 192.168.66.1/24
    - 10.0.0.1/24
    - 10.0.1.1/24
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24
    - 2001:67c:4e8::/48
    - 2001:b28:f23c::/47
    - 2001:b28:f23f::/48
    - 2a0a:f280:203::/48
    
# 入站  
tun:
  enable: true
  stack: mips
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  strict-route: true
  auto-detect-interface: true
  endpoint-independent-nat: true
  route-exclude-address-set: [cn_ip]

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true     # dns 连接遵守路由规则,需配置 proxy-server-nameserver
  # 模式切换 redir-host / fake-ip
  enhanced-mode: redir-host
  cache-algorithm: arc    # 使用性能更优的ARC缓存算法
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://8.8.8.8/dns-query?ecs=223.5.5.0/24#🔗 默认代理
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "rule-set:cn_domain,private_domain,steamcn_domain,microsoftcn_domain,applecn_domain":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query

# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
default: &default {type: select, proxies: [ 🔗 默认代理, 🔜 故转, ♻️ 自动选择, 🐸 手动选择, 🇭🇰 香港手动, 🇰🇷 韩国手动, 🇯🇵 日本手动, 🇺🇸 美国手动, 🇸🇬 新加坡手动, 🎯 直连]}
proxy-groups:
  - {name: 🔗 默认代理, type: select,proxies: [🔜 故转,♻️ 自动选择, 🇭🇰 香港手动, 🇰🇷 韩国手动, 🇯🇵 日本手动, 🇺🇸 美国手动,🇸🇬 新加坡手动]}
  - {name: 🤖 AI, <<: *default}
  - {name: 🎬 YouTube, <<: *default}
  - {name: 🍀 Google, <<: *default}
  - {name: 🪴 GitHub, <<: *default}
  - {name: 📱 Telegram, <<: *default}
  - {name: 🎵 TikTok, <<: *default}
  - {name: 🎥 Netflix, <<: *default}
  - {name: 💶 Wallet, <<: *default}
  - {name: 🎮 Steam, <<: *default}
  - {name: Ⓜ️ Microsoft, <<: *default}
  - {name: 🐬 OneDrive, <<: *default}
  - {name: 🍏 Apple, <<: *default}
  - {name: 🐟 漏网之鱼, <<: *default}
  - {name: 🇭🇰 香港手动, type: select, include-all: true, filter: "港|香港|HK|hk|(?i)Hong Kong|🇭🇰"}
  - {name: 🇰🇷 韩国手动, type: select, include-all: true, filter: "韩|韩国|韓|KR|kr|(?i)Korea|🇰🇷"}
  - {name: 🇯🇵 日本手动, type: select, include-all: true, filter: "日|日本|JP|jp|(?i)Japan|🇯🇵"}
  - {name: 🇺🇸 美国手动, type: select, include-all: true, filter: "美|美国|US|us|(?i)United States|America|🇺🇸"}
  - {name: 🇸🇬 新加坡手动, type: select, include-all: true, filter: "新|新加坡|SG|sg|(?i)Singapore|🇸🇬"}
  - {name: 🔜 故转, type: fallback, include-all: true, lazy: true, interval: 300, url: 'https://www.gstatic.com/generate_204', filter: "^((?!(直连|拒绝)).)*$"}
  - {name: 🐸 手动选择, type: select, include-all: true, filter: "^((?!(直连|拒绝)).)*$"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 50,lazy: true, interval: 300, url: 'https://www.gstatic.com/generate_204', filter: "^((?!(直连|拒绝)).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true}

# 规则匹配
rules:
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,🎯 直连,no-resolve
  - RULE-SET,private_domain,🎯 直连
  - RULE-SET,ai_domain,🤖 AI
  - RULE-SET,youtube_domain,🎬 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,github_domain,🪴 GitHub
  - RULE-SET,telegram_domain,📱 Telegram
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,netflix_domain,🎥 Netflix
  - RULE-SET,paypal_domain,💶 Wallet
  - RULE-SET,binance_domain,💶 Wallet
  - RULE-SET,okx_domain,💶 Wallet
  - RULE-SET,usd_domain,💶 Wallet
  - RULE-SET,steamcn_domain,🎯 直连
  - RULE-SET,steam_domain,🎮 Steam
  - RULE-SET,microsoftcn_domain,🎯 直连
  - RULE-SET,microsoft_domain,Ⓜ️ Microsoft
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,applecn_domain,🎯 直连
  - RULE-SET,apple_domain,🍏 Apple
  - RULE-SET,cn!_domain,🔗 默认代理
  - RULE-SET,google_ip,🍀 Google,no-resolve
  - RULE-SET,apple_ip,🍏 Apple,no-resolve
  - RULE-SET,telegram_ip,📱 Telegram,no-resolve
  - RULE-SET,netflix_ip,🎥 Netflix,no-resolve
  - RULE-SET,cn_ip,🎯 直连,no-resolve
  - MATCH,🐟 漏网之鱼
  

